# .github/workflows/build.yml

name: Build Python Executable

# این Action چه زمانی اجرا شود؟
# در اینجا، با هر push به شاخه main اجرا می‌شود
on:
  push:
    branches: [ "main" ]

jobs:
  build:
    # سیستم‌عاملی که Action روی آن اجرا می‌شود (برای فایل exe ویندوز لازم است)
    runs-on: windows-latest

    steps:
      # مرحله ۱: کد پروژه را از ریپازیتوری دریافت می‌کند
      - name: Checkout repository
        uses: actions/checkout@v4

      # مرحله ۲: پایتون را روی ماشین مجازی نصب و راه‌اندازی می‌کند
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # می‌توانید نسخه پایتون خود را مشخص کنید

      # مرحله ۳: کتابخانه‌های مورد نیاز پروژه را نصب می‌کند
      # اگر فایل requirements.txt دارید، آن را از کامنت خارج کنید
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      # مرحله ۴: دستور PyInstaller را برای ساخت فایل exe اجرا می‌کند
      - name: Build executable with PyInstaller
        run: |
          pyinstaller --onefile --windowed --icon="clock.ico" --add-data "Vazirmatn-Regular.ttf;." main.py

      # مرحله ۵: فایل exe ساخته‌شده را به عنوان یک آرتیفکت آپلود می‌کند
      # تا بتوانید آن را از صفحه Actions دانلود کنید
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app-executable
          # فایل exe در پوشه dist ساخته می‌شود
          path: dist/main.exe
