
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>گزارش زمانی</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Tahoma', sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 20px;
        }
        .container {
            max-width: 900px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1, h2 {
            color: #0056b3;
            border-bottom: 2px solid #0056b3;
            padding-bottom: 10px;
        }
        .summary, .details {
            margin-bottom: 30px;
        }
        .summary ul {
            list-style-type: none;
            padding: 0;
        }
        .summary li {
            background: #e9ecef;
            margin-bottom: 8px;
            padding: 10px;
            border-radius: 4px;
        }
        .details .date-group {
            margin-bottom: 20px;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 5px;
        }
        .details .date-header {
            font-size: 1.2em;
            font-weight: bold;
            color: #28a745;
        }
        .details ul {
            padding-right: 20px;
        }
        .details li {
            margin-bottom: 5px;
        }
        .notes {
            color: #6c757d;
            font-size: 0.9em;
            padding-right: 15px;
        }
        .chart-container {
            width: 60%;
            margin: 40px auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 گزارش زمانی فعالیت‌ها</h1>
        
        <div class="chart-container">
            <h2>تخصیص زمان بر اساس دسته‌بندی</h2>
            <canvas id="categoryChart"></canvas>
        </div>

        <div class="summary">
            <h2>خلاصه فعالیت‌ها</h2>
            <ul>
                <li>مجموع 'ي': 0 ساعت و 0 دقیقه و 2 ثانیه</li>
            </ul>
        </div>

        <div class="details">
            <h2>جزئیات زمانی</h2>
            <div class="date-group"><p class="date-header">🗓️ 1404/05/11</p><ul><li>ي (0 دقیقه و 2 ثانیه) | از 12:29 تا 12:29</li></ul></div>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('categoryChart').getContext('2d');
        const categoryData = {
            labels: ["\u0628\u062f\u0648\u0646 \u062f\u0633\u062a\u0647"],
            datasets: [{
                label: 'ساعت',
                data: [0.0],
                backgroundColor: [
                    'rgba(255, 99, 132, 0.7)',
                    'rgba(54, 162, 235, 0.7)',
                    'rgba(255, 206, 86, 0.7)',
                    'rgba(75, 192, 192, 0.7)',
                    'rgba(153, 102, 255, 0.7)',
                    'rgba(255, 159, 64, 0.7)',
                    'rgba(199, 199, 199, 0.7)'
                ],
                borderColor: '#fff',
                borderWidth: 2
            }]
        };

        new Chart(ctx, {
            type: 'pie',
            data: categoryData,
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'top',
                        labels: {
                           font: {
                                family: 'Tahoma'
                            }
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>
